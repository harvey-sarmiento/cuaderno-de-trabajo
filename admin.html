<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Control - 30 Días</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
  :root {
    --bg: #080C10;
    --card: #121820;
    --line: #1E293B;
    --p: #FF5C00;
    --ink: #F3F6F9;
    --soft: #8A9BA8;
    --ok: #00C896;
  }
  body { background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; margin: 0; }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 24px; color: var(--p); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  
  /* Pantalla de Bloqueo */
  #login-screen {
    max-width: 360px;
    margin: 80px auto;
    text-align: center;
  }
  input[type=password] {
    width: 100%;
    padding: 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--ink);
    font-size: 16px;
    margin-bottom: 12px;
    box-sizing: border-box;
  }
  .btn {
    width: 100%;
    padding: 14px;
    background: var(--p);
    color: white;
    border: 0;
    border-radius: 12px;
    font-weight: 800;
    cursor: pointer;
  }

  /* Ocultar contenido por defecto */
  #admin-content { display: none; }
  
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--soft); font-size: 13px; text-transform: uppercase; }
  .progress-bar { background: var(--line); border-radius: 99px; height: 8px; width: 100%; overflow: hidden; margin-top: 4px; }
  .progress-fill { background: linear-gradient(90deg, var(--p), #F5A623); height: 100%; }
  .badge { background: rgba(0,200,150,0.1); color: var(--ok); padding: 4px 8px; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>

<!-- PANTALLA DE ACCESO -->
<div id="login-screen" class="card">
  <h2>🔒 Acceso Privado</h2>
  <p style="color:var(--soft); font-size: 14px;">Ingresa tu clave de administrador para ver el progreso de tus alumnos.</p>
  <input type="password" id="passInput" placeholder="Contraseña">
  <button class="btn" onclick="verificarClave()">Ingresar al Panel</button>
  <p id="errorMsg" style="color:#FF3B30; font-size: 13px; display:none; margin-top:10px;">Contraseña incorrecta</p>
</div>

<!-- CONTENIDO DEL PANEL (SE OCULTA HASTA VALIDAR) -->
<div id="admin-content" class="container">
  <h1>📊 Panel de Control de Alumnos</h1>
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Alumno</th>
          <th>Objetivo</th>
          <th>Progreso</th>
          <th>Nivel / XP</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="lista-alumnos">
        <!-- Se llena con los datos del servidor -->
      </tbody>
    </table>
  </div>
  <button class="btn" style="background:transparent; border:1px solid var(--line); color:var(--soft); width:auto;" onclick="cerrarSesion()">Cerrar Sesión</button>
</div>

<script>
  // CONFIGURA AQUÍ TU CONTRASEÑA
  const CLAVE_SECRETA = "9612harvey";

  const JSONBIN_BIN_ID = "6aeb94effd5d16053a602cc";
  const JSONBIN_API_KEY = "$2a$10$syXzAqaJb8XVPR0HXnPkeh0EuE9DbB5uAzznbbdyu0CUsStNUXZq";

  function verificarClave() {
    const pass = document.getElementById("passInput").value;
    if (pass === CLAVE_SECRETA) {
      sessionStorage.setItem("admin_auth", "true");
      mostrarPanel();
    } else {
      document.getElementById("errorMsg").style.display = "block";
    }
  }

  function mostrarPanel() {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("admin-content").style.display = "block";
    cargarAlumnos();
  }

  function cerrarSesion() {
    sessionStorage.removeItem("admin_auth");
    location.reload();
  }

  // Verificar si ya inició sesión previamente en esta ventana
  if (sessionStorage.getItem("admin_auth") === "true") {
    mostrarPanel();
  }

  async function cargarAlumnos() {
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: { "X-Master-Key": JSONBIN_API_KEY }
      });
      const data = await res.json();
      const user = data.record;

      const tbody = document.getElementById("lista-alumnos");
      tbody.innerHTML = `
        <tr>
          <td><b>${user.nombre}</b></td>
          <td>${user.objetivo}</td>
          <td>
            ${user.progresos}
            <div class="progress-bar"><div class="progress-fill" style="width: ${(parseInt(user.progresos)/30)*100}%"></div></div>
          </td>
          <td><span class="badge">${user.nivel}</span> (${user.xp} XP)</td>
          <td>🟢 Activo</td>
        </tr>
      `;
    } catch (e) {
      console.error("Error al obtener datos:", e);
    }
  }
</script>
</body>
</html>
